# Profiling, gccollect-quick: Same as baseline-quick, with a full garbage collection every minute.
# Copy of quick_test/wheat_winter.yml (rcp45, CCSM4, low, SSP3).
# Quick mode: one Kansas region (USA.17.906) and only the four montecarlo files, to keep it
# short. For checking that the wrapper runs only: with one region the memory
# never piles up, so the full run is the real test.
# Outputs go to scratch. The jobs pass
# --outputdir=/scratch/midway3/$USER/agri-profiling/gccollect-quick/outputs
# on the command line, so each user writes to their own scratch.
# The kit on Midway imports ../../../configs/wheat_winter_pbarspline.yml
# (hpc-jobs/agriculture/configs/), copied here to configs/base/.
import: "../base/wheat_winter_pbarspline.yml"
mode: single
outputdir: /scratch/midway3/cadavidsanchez/agri-profiling/gccollect-quick/outputs
do_farmers: true
do_historical: true
only-rcp: rcp45
only-models: [CCSM4]
only-ssp: SSP3
only-iam: low
filter-region: USA.17.906
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
