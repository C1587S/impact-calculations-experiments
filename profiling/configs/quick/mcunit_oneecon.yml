# Profiling, mcunit_oneecon-quick: Same unit as mcunit, but with only the CSV it uses. The job copies
# the mcunit pvals.yml first, so both draw the same coefficients.
# Built from quick_test/wheat_winter.yml (rcp45, CCSM4, low, SSP3)
# with the settings of montecarlo/wheat_winter-rcp85.yml.
# Quick mode: one Kansas region (USA.17.906) and only the four montecarlo files, to keep it
# short. It shows the shape of a run, not final timings.
# Outputs go to scratch. The jobs pass
# --outputdir=/scratch/midway3/$USER/agri-profiling/mcunit_oneecon-quick/outputs
# and --socioeconomic_data_dir=/scratch/midway3/$USER/agri-profiling/econ/SSP3-low/
# on the command line, so each user writes to their own scratch.
# The kit on Midway imports ../../../configs/wheat_winter_pbarspline.yml
# (hpc-jobs/agriculture/configs/), copied here to configs/base/.
import: "../base/wheat_winter_pbarspline.yml"
mode: montecarlo
outputdir: /scratch/midway3/cadavidsanchez/agri-profiling/mcunit_oneecon-quick/outputs
timeout: 12
do_farmers: true
do_historical: true
only-rcp: rcp45
only-models: [CCSM4]
only-ssp: SSP3
only-iam: low
only-batch-number: 0
filter-region: USA.17.906
socioeconomic_data_dir: /scratch/midway3/cadavidsanchez/agri-profiling/econ/SSP3-low/
