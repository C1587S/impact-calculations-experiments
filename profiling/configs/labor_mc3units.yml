# Profiling, labor_mc3units: three labor montecarlo units in one process, on
# master, the reference for labor_mc3units_gccollect_econfix.
# Batch 0, rcp85, SSP3, high, with CCSM4, GFDL-ESM2M and MIROC5 run one after
# another in one process, as a production montecarlo worker does, with the settings of
# labor/configs/montecarlo/ssp3-rcp85-high.yml.
# The projection system shuffles the units, so their order may differ
# between runs. seed-csvv is fixed to the draw of the production labor montecarlo, batch 0, CCSM4
# (its pvals.yml in /project/cil/gcp/outputs_newsocioeconomics/labor/montecarlo/), so every unit of both
# versions uses the same coefficients. The histclim year order is a hash of
# each unit's folder, so it matches between runs too.
# Outputs go to scratch. The jobs pass
# --outputdir=/scratch/midway3/$USER/agri-profiling/labor_mc3units/outputs
# on the command line, so each user writes to their own scratch.
import: "base/uninteracted_main_model.yml"
mode: montecarlo
outputdir: /scratch/midway3/cadavidsanchez/agri-profiling/labor_mc3units/outputs
timeout: 12
do_farmers: true
do_historical: true
only-rcp: rcp85
only-models: [CCSM4, GFDL-ESM2M, MIROC5]
only-ssp: SSP3
only-iam: high
only-batch-number: 0
pvals:
  uninteracted_main_model_agnonag_27_28_41:
    seed-csvv: 100473597000641500511243794462613005915
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
