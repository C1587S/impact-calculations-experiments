# Profiling, mcunit_oneecon: Same unit as mcunit, but with only the CSV it uses. The job copies
# the mcunit pvals.yml first, so both draw the same coefficients.
# Built from single/wheat_winter-ssp3-rcp85-high.yml (rcp85, CCSM4, high, SSP3)
# with the settings of montecarlo/wheat_winter-rcp85.yml.
# Outputs go to scratch. The jobs pass
# --outputdir=/scratch/midway3/$USER/agri-profiling/mcunit_oneecon/outputs
# and --socioeconomic_data_dir=/scratch/midway3/$USER/agri-profiling/econ/SSP3-high/
# on the command line, so each user writes to their own scratch.
# The kit on Midway imports ../../configs/wheat_winter_pbarspline.yml
# (hpc-jobs/agriculture/configs/), copied here to configs/base/.
import: "base/wheat_winter_pbarspline.yml"
mode: montecarlo
outputdir: /scratch/midway3/cadavidsanchez/agri-profiling/mcunit_oneecon/outputs
timeout: 12
do_farmers: true
do_historical: true
only-rcp: rcp85
only-models: [CCSM4]
only-ssp: SSP3
only-iam: high
only-batch-number: 0
socioeconomic_data_dir: /scratch/midway3/cadavidsanchez/agri-profiling/econ/SSP3-high/
