# Profiling, soy_gccollect_econfix: the soy single on the econmodel-memory branch of
# impact-calculations, with a full garbage collection every minute.
# Copy of single/soy-ssp3-rcp85-high.yml (rcp85, CCSM4, high, SSP3).
# Outputs go to scratch. The jobs pass
# --outputdir=/scratch/midway3/$USER/agri-profiling/soy_gccollect_econfix/outputs
# on the command line, so each user writes to their own scratch.
# The kit on Midway imports ../../configs/soy-160221.yml
# (hpc-jobs/agriculture/configs/), copied here to configs/base/.
import: "base/soy-160221.yml"
mode: single
outputdir: /scratch/midway3/cadavidsanchez/agri-profiling/soy_gccollect_econfix/outputs
do_farmers: 'always'
do_historical: true
only-rcp: rcp85
only-models: [CCSM4]
only-ssp: SSP3
only-iam: high
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
